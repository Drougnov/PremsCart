services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: premscart_db
      POSTGRES_USER: premscart
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U premscart -d premscart_db"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped

  api:
    build: ./backend/PremsCart.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5000"
      AllowedHosts: "*"

      ConnectionStrings__DefaultConnection: "Host=db;Database=premscart_db;Username=premscart;Password=${DB_PASSWORD}"

      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}

      Database__AutoMigrate: "true"

      Bootstrap__AdminEmail: ${ADMIN_EMAIL:-admin@premscart.local}
      Bootstrap__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}

      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__EnableSsl: "false"
      Smtp__From: campus@premscart.local

    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_PROXY: "http://api:5000"

    ports:
      - "127.0.0.1:5173:5173"

    depends_on:
      - api

    restart: unless-stopped

volumes:
  database:
  uploads: